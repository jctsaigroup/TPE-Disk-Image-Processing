site_name: TPE Disk Image Processing
site_description: A three-step pipeline for tracking photoelastic disks, detecting contacts, and computing force vectors in granular experiments.
site_author: jctsaigroup
site_url: https://linjunJR.github.io/TPE_Disk_Image_Processing/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - glightbox

nav:
  - Home: index.md
  - Setup: setup.md
  - Usage Guide: usage.md
  - How it Works:
    - StarDist: stardist.md
    - Finding orientation angles: angles.md
    - Finding G^2: g2.md
    - Contact Detection: contact-detect.md
    - Simulating Residual Stresses: residual-stress.md 
    - Contact Force Initial Guess: force-guess.md
    - Fitting to Find Forces: force-solve.md
  - Training Your Own :
    - Overview: train-overview.md
    - StarDist: stardist-train.md
    - Contact Detection: contact-detect-train.md
    - Contact Force Guesser: force-guess-train.md


